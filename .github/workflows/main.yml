
name: Publish Malaysia Dividend Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Daily at 9:17 AM Malaysia time (UTC+8)
    - cron: "17 1 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dividend calendar
        run: python scripts/build.py

      - name: Verify website files
        run: |
          ls -lah site/
          test -s site/index.html
          test -s site/dividends.ics

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
